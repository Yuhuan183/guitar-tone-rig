name: check

# Pull requests only. deploy.yml runs the same gate on every push to main
# before it publishes, so a second run here would just be the same work twice.
on: pull_request

# `npm ci` runs dependency lifecycle scripts, and this workflow runs on pull
# requests from anywhere. Declare the token read-only here rather than inherit
# whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run validate:app
